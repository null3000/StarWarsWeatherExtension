name: Upload to Chrome Web Store

on:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Create env.js
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          MODEROK_APP_KEY: ${{ secrets.MODEROK_APP_KEY }}
        run: |
          cat > src/env.js <<EOF
          // Generated during packaging. Do not commit this file.
          const API_KEY = "${OPENWEATHER_API_KEY}";
          const MODEROK_APP_KEY = "${MODEROK_APP_KEY}";
          globalThis.API_KEY = API_KEY;
          globalThis.MODEROK_APP_KEY = MODEROK_APP_KEY;
          export { API_KEY, MODEROK_APP_KEY };
          EOF

      # after env.js: background.js imports it, so the tests need it on disk
      - name: Run tests
        run: bun test

      - name: Install cws-cli
        run: |
          curl -LO https://github.com/vaughnbosu/cws-cli/releases/latest/download/cws_linux_amd64.tar.gz
          tar xzf cws_linux_amd64.tar.gz
          sudo mv cws /usr/local/bin/

      - name: Upload extension
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          cws upload . -e ${{ vars.EXTENSION_ID }}
          cws publish --staged -e ${{ vars.EXTENSION_ID }}
